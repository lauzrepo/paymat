name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Step 1: Classify the bump ──────────────────────────────────────────────
  triage:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      bump-level: ${{ steps.parse.outputs.bump-level }}
      workspace: ${{ steps.parse.outputs.workspace }}
    steps:
      - name: Parse PR metadata
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Workspace from branch: dependabot/npm_and_yarn/<workspace>/...
            const branchMatch = pr.head.ref.match(/^dependabot\/npm_and_yarn\/([^/]+)/);
            const workspace = branchMatch?.[1] ?? '';

            // Scan title + body for all "from X.Y.Z to A.B.C" pairs
            const text = `${pr.title}\n${pr.body ?? ''}`;
            const re = /from (\d+)\.\d+[\.\d]* to (\d+)\.\d+[\.\d]*/gi;
            let hasMajor = false, hasVersions = false, m;
            while ((m = re.exec(text)) !== null) {
              hasVersions = true;
              if (m[1] !== m[2]) { hasMajor = true; break; }
            }

            const level = !hasVersions ? 'unknown' : hasMajor ? 'major' : 'minor-patch';
            core.setOutput('bump-level', level);
            core.setOutput('workspace', workspace);
            core.info(`workspace=${workspace}  bump-level=${level}`);

  # ── Step 2a: Type-check + auto-merge minor/patch ───────────────────────────
  automerge:
    needs: triage
    runs-on: ubuntu-latest
    if: needs.triage.outputs.bump-level == 'minor-patch'
    steps:
      - uses: actions/checkout@v6
        with:
          # Safe: dependabot only touches package.json / lockfiles, never workflows
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ needs.triage.outputs.workspace }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ needs.triage.outputs.workspace }}
        run: npm ci

      - name: TypeScript type-check
        working-directory: ${{ needs.triage.outputs.workspace }}
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json — skipping type-check"
          fi

      - name: Squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch

  # ── Step 2b: Label major bumps for manual review ──────────────────────────
  label-major:
    needs: triage
    runs-on: ubuntu-latest
    if: >
      needs.triage.outputs.bump-level == 'major' ||
      needs.triage.outputs.bump-level == 'unknown'
    steps:
      - name: Ensure label exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'needs-review',
                color: 'e4e669',
                description: 'Major version bump — requires manual review before merging',
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = already exists, fine
            }

      - name: Apply label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-review'],
            });
            core.info('Labeled as needs-review (major bump or unparseable version)');
